<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vyline LAN接続テスト</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 24px; background: #101318; color: #f4f6f8; }
      main { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #aeb8c4; line-height: 1.6; }
      .card { margin-top: 18px; padding: 16px; border: 1px solid #303945; border-radius: 14px; background: #171c24; }
      .row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #29313d; }
      .row:last-child { border-bottom: 0; }
      .label { color: #aeb8c4; }
      .value { text-align: right; overflow-wrap: anywhere; }
      .ok { color: #6ee7a0; }
      .ng { color: #ff8d8d; }
      button { margin-top: 18px; padding: 10px 14px; border: 0; border-radius: 9px; background: #6ee7a0; color: #0e1711; font-weight: 700; }
      code { color: #d6e4ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vyline LAN接続テスト</h1>
      <p>このページが表示されれば、スマホからVylineのフロントエンドには接続できています。</p>
      <div class="card" aria-live="polite">
        <div class="row"><span class="label">ページ表示</span><strong id="page" class="ok">成功</strong></div>
        <div class="row"><span class="label">アクセス元</span><span id="origin" class="value"></span></div>
        <div class="row"><span class="label">APIプロキシ</span><strong id="api" class="value">確認中…</strong></div>
        <div class="row"><span class="label">確認時刻</span><span id="time" class="value"></span></div>
      </div>
      <button type="button" onclick="runTest()">もう一度確認</button>
      <p><code>APIプロキシ</code> が成功なら、LAN経路とバックエンド接続も通っています。</p>
    </main>
    <script>
      async function runTest() {
        const api = document.getElementById("api");
        const time = document.getElementById("time");
        document.getElementById("origin").textContent = location.origin;
        time.textContent = new Date().toLocaleString();
        api.className = "value";
        api.textContent = "確認中…";
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);
        try {
          const response = await fetch("/api/healthz", { signal: controller.signal, cache: "no-store" });
          const body = await response.text();
          if (!response.ok) throw new Error("HTTP " + response.status + " " + body.slice(0, 80));
          api.className = "value ok";
          api.textContent = "成功（HTTP " + response.status + "）";
        } catch (error) {
          api.className = "value ng";
          api.textContent = error.name === "AbortError" ? "失敗（5秒 timeout）" : "失敗（" + error.message + "）";
        } finally {
          clearTimeout(timer);
        }
      }
      runTest();
    </script>
  </body>
</html>
