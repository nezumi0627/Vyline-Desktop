name: Windows Beta

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のRelease tag (例: v0.1.0-beta.2)"
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }
      - run: bun run desktop:sidecar
      - run: bun run desktop:build
      - name: Upload beta artifacts
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Vyline Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} (Windows Beta)
          draft: false
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Vyline/apps/desktop/release/Vyline-Desktop-*-setup.exe
            Vyline/apps/desktop/release/Vyline-Desktop-*-setup.exe.blockmap
            Vyline/apps/desktop/release/Vyline-Desktop-*-x64.exe
            Vyline/apps/desktop/release/latest.yml
